<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGDG & Co. Gacha</title>
  <style>
    :root {
      --bg: #121217;
      --surface: #1e1e26;
      --text: #f0f0f5;
      --common: #a3a3a3;
      --uncommon: #82b366;
      --rare: #6c8ebf;
      --epic: #9673a6;
      --legendary: #d6b656;
      --mythic: #ea6b66;
      --special: #ffbeef;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1, h2 { margin-top: 0; }
    .container { max-width: 800px; width: 100%; }

    /* Pack Pull Section */
    .pull-zone {
      background: var(--surface);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 2rem;
      border: 1px solid #2e2e3a;
    }

    /* Top status bar for coins & pack queue */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .coin-badge {
      background: #2a2414;
      border: 1px solid #d6b656;
      color: #ffd966;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .queue-badge {
      background: #1a1f33;
      border: 1px solid #4f46e5;
      color: #c7d2fe;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .xp-badge {
      background: #142a22;
      border: 1px solid #34d399;
      color: #6ee7b7;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 0.85rem 1.75rem;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover:not(:disabled) { transform: scale(1.03); }
    button:disabled { background: #3f3f4e; cursor: not-allowed; opacity: 0.7; }

    .pack-display {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      min-height: 250px;
    }

    /* Card Styling & Rarity Borders */
    .card {
      width: 180px;
      height: 255px;
      background: #252530;
      border-radius: 10px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 3px solid var(--common);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      animation: popIn 0.35s ease-out forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.8) translateY(15px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .rarity-Common { border-color: var(--common); }
    .rarity-Uncommon { border-color: var(--uncommon); }
    .rarity-Rare { border-color: var(--rare); }
    .rarity-Epic { border-color: var(--epic); }
    .rarity-Legendary { border-color: var(--legendary); box-shadow: 0 0 15px rgba(214, 182, 86, 0.4); }
    .rarity-Mythic { border-color: var(--mythic); box-shadow: 0 0 20px rgba(234, 107, 102, 0.6); }
    .rarity-Special { border-color: var(--special); box-shadow: 0 0 20px rgba(255, 190, 239, 0.6); }

    .card-rarity { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    
    .card-img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: #14141a;
    }

    .card-name { font-size: 1.15rem; font-weight: 700; word-break: break-word; }
    .card-mod { font-size: 0.75rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,0.45); }

    /* Modifiers */
    .mod-Holo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,0,0,0.18), rgba(0,255,0,0.18), rgba(0,0,255,0.18));
      mix-blend-mode: color-dodge;
      pointer-events: none;
    }
    .mod-Foil {
      background: linear-gradient(135deg, #2a2a38 0%, #484860 50%, #2a2a38 100%);
    }
    .mod-Shiny {
      box-shadow: 0 0 25px #fff, inset 0 0 15px rgba(255, 223, 100, 0.6);
    }

    /* Collection Panel */
    .panel {
      background: var(--surface);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #2e2e3a;
    }

    ul { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.8rem;
      border-bottom: 1px solid #2a2a35;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      border-radius: 6px;
    }

    li:hover {
      background: #121217;
    }
    
    .del-btn {
      background: #dc2626;
      padding: 0.3rem 0.65rem;
      font-size: 0.8rem;
    }

    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--surface);
      padding: 2.5rem 2rem 2rem 2rem;
      border-radius: 14px;
      border: 1px solid #3f3f4e;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      animation: popIn 0.25s ease-out;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #aaa;
      background: none;
      border: none;
      padding: 0;
    }
    .close-btn:hover { color: #fff; transform: none; }
    .modal-count { font-size: 0.9rem; color: #a3a3a3; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <h1>PGDG & Co. Gacha</h1>

  <!-- Pull Section -->
  <div class="pull-zone">
    <div class="status-bar">
      <div class="coin-badge">🪙 Coins: <span id="coinCount">0</span></div>

  <!-- Inventory / Collection -->
  <div class="panel">

<div id="cardModal" class="modal" onclick="closeModal()">

    <button class="close-btn" onclick="closeModal()">&times;</button>

  </div>
</div>

  // =========================================================================

  // 1. Exact Rarity Rates
  const RARITIES = [
    { name: "Special", chance: 0.01},
    { name: "Mythic", chance: 0.075 },
    { name: "Legendary", chance: 0.3 },
    { name: "Epic", chance: 1.7 },
    { name: "Rare", chance: 7.5 },
    { name: "Uncommon", chance: 15.0 },
    { name: "Common", chance: 75.415 }
  ];

  // 2. Exact Modifier Rates
  const MODIFIERS = [
    { name: "Shiny", chance: 1 / 1000 },
    { name: "Foil", chance: 1 / 100 },
    { name: "Holo", chance: 1 / 20 }
  ];

  // [NEW JS] Coin values per rarity and multipliers per modifier
  const COIN_VALUES = {
    Common: 10,
    Uncommon: 20,
    Rare: 100,
    Epic: 400,
    Legendary: 800,
    Mythic: 2400,
    Special: 8192
  };

  const MODIFIER_MULTIPLIERS = {
    Standard: 1,
    Holo: 2,
    Foil: 4,
    Shiny: 8
  };

  // [NEW JS] Pack Queue settings (max 5 packs, 1 new pack every 2 minutes)
  const MAX_PACKS = 5;
  const PACK_INTERVAL_MS = 2 * 60 * 1000; // 2 minutes

  const FALLBACK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%2314141a'/><text x='50%' y='55%' font-size='40' text-anchor='middle' fill='%23555'>?</text></svg>";

  // Load saved state from localStorage
  let collection = JSON.parse(localStorage.getItem("gacha_collection")) || {};
  let coins = parseInt(localStorage.getItem("gacha_coins")) || 0;
  let xp = parseInt(localStorage.getItem("gacha_xp")) || 0;

  // For first-time visitors, start with 1 pack ready; otherwise load saved queue state
  let queuedPacks = localStorage.getItem("gacha_packs") !== null
    ? parseInt(localStorage.getItem("gacha_packs"))
    : 1;

  // Timestamp of when the current generation cycle started
  let nextPackAt = parseInt(localStorage.getItem("gacha_next_pack_at")) || (Date.now() + PACK_INTERVAL_MS);

  function saveState() {
    localStorage.setItem("gacha_collection", JSON.stringify(collection));
    localStorage.setItem("gacha_coins", coins.toString());
    localStorage.setItem("gacha_xp", xp.toString());
    localStorage.setItem("gacha_packs", queuedPacks.toString());
    localStorage.setItem("gacha_next_pack_at", nextPackAt.toString());
  }

  // [NEW JS] Calculates coins earned for a single pulled card
  function calculateCardCoins(rarity, modifier) {
    const base = COIN_VALUES[rarity] || 0;
    const mult = MODIFIER_MULTIPLIERS[modifier] || 1;
    return base * mult;
  }

  // Calculates XP earned for a card (random value between 80% and 120% of its coins)
  function calculateCardXP(cardCoins) {
    const multiplier = 0.8 + Math.random() * 0.4; // Random decimal from 0.80 to 1.20
    return Math.round(cardCoins * multiplier);
  }

  // [NEW JS] Generates queued packs automatically as 2-minute intervals pass (up to 5)
  function syncPackQueue() {
    const now = Date.now();
    let changed = false;

    while (queuedPacks < MAX_PACKS && now >= nextPackAt) {
      queuedPacks++;
      nextPackAt += PACK_INTERVAL_MS;
      changed = true;
    }

    // If the queue is full, keep nextPackAt pushed ahead so it starts cleanly once a pack is opened
    if (queuedPacks >= MAX_PACKS) {
      nextPackAt = now + PACK_INTERVAL_MS;
    }

    if (changed) {
      saveState();
    }
  }

  function rollRarity() {
    const roll = Math.random() * 100;
    let cumulative = 0;
    for (const r of RARITIES) {
      cumulative += r.chance;
      if (roll < cumulative) return r.name;
    }
    return "Common";
  }

  function rollModifier() {
    for (const mod of MODIFIERS) {
      if (Math.random() < mod.chance) return mod.name;
    }
    return "Standard";
  }

  function getAllCardsFallback() {
    return Object.entries(CARD_POOL).flatMap(([rarity, people]) =>
      people.map(person => ({ ...person, rarity }))
    );
  }

  function openPack() {
    syncPackQueue();
    if (queuedPacks <= 0) return;

    const allCards = getAllCardsFallback();
    if (allCards.length === 0) {
      alert("No cards have been configured in CARD_POOL yet!");
      return;
    }

    // If queue was full (5/5), start the 2-minute timer for the next pack right now
    const wasFull = queuedPacks >= MAX_PACKS;
    queuedPacks--;
    if (wasFull) {
      nextPackAt = Date.now() + PACK_INTERVAL_MS;
    }

    const display = document.getElementById("packDisplay");
    display.innerHTML = "";
    let earnedThisPack = 0;
    let earnedXPThisPack = 0;

    for (let i = 0; i < 3; i++) {
      let chosenRarity = rollRarity();
      let candidates = (CARD_POOL[chosenRarity] || []).map(p => ({ ...p, rarity: chosenRarity }));

      if (candidates.length === 0) {
        candidates = allCards;
      }

      const person = candidates[Math.floor(Math.random() * candidates.length)];
      const modifier = rollModifier();

      // [NEW JS] Award coins for this card
      const cardCoins = calculateCardCoins(person.rarity, modifier);
      const cardXP = calculateCardXP(cardCoins);
      coins += cardCoins;
      xp += cardXP;
      earnedThisPack += cardCoins;
      earnedXPThisPack += cardXP;

      const cardKey = `${person.name} [${person.rarity}] (${modifier})`;
      collection[cardKey] = (collection[cardKey] || 0) + 1;

      const cardEl = createCardElement(person.name, person.rarity, modifier, person.image);
      display.appendChild(cardEl);
    }

   const timerText = document.getElementById("timerText");
    timerText.dataset.lastReward = `+${earnedThisPack} coins, +${earnedXPThisPack} XP!`;

    saveState();
    renderCollection();
    updateUI();
  }

  function createCardElement(name, rarity, modifier, imageUrl) {
    const cardEl = document.createElement("div");
    cardEl.className = `card rarity-${rarity} mod-${modifier}`;
    cardEl.innerHTML = `
      <div class="card-rarity" style="color: var(--${rarity.toLowerCase()})">${rarity}</div>
      <img class="card-img" src="${imageUrl}" onerror="this.src='${FALLBACK_IMG}'" alt="${name}" />
      <div class="card-name">${name}</div>
      <div class="card-mod">${modifier === "Standard" ? "Normal" : "✨ " + modifier}</div>
    `;
    return cardEl;
  }

  function clearCollection() {
    if (confirm("Clear your entire pulled card collection?")) {
      collection = {};
      saveState();
      renderCollection();
    }
  }

function renderCollection() {
    const list = document.getElementById("collectionList");
    list.innerHTML = "";
    const entries = Object.entries(collection);
    
    if (entries.length === 0) {
      list.innerHTML = `<li style="color:#777; cursor:default;">No cards pulled yet.</li>`;
      return;
    }

    entries.forEach(([cardKey, count]) => {
      // Parse cardKey back into name, rarity, modifier
      const match = cardKey.match(/^(.+?)\s+\[(.+?)\]\s+\((.+?)\)$/);
      if (!match) return;
      const [, name, rarity, modifier] = match;

      const li = document.createElement("li");
      li.innerHTML = `<span>${cardKey}</span> <strong>x${count}</strong>`;
      // 👉 This makes each collection row clickable:
      li.onclick = () => showCardModal(name, rarity, modifier, count);
      list.appendChild(li);
    });
  }

  function showCardModal(name, rarity, modifier, count) {
    // Find image URL from CARD_POOL
    let imageUrl = "https://via.placeholder.com/150";
    if (CARD_POOL[rarity]) {
      const found = CARD_POOL[rarity].find(p => p.name === name);
      if (found) imageUrl = found.image;
    }

    const modalSlot = document.getElementById("modalCardSlot");
    modalSlot.innerHTML = "";
    modalSlot.appendChild(createCardElement(name, rarity, modifier, imageUrl));

    document.getElementById("modalCardCount").textContent = `You own: ${count} copy${count > 1 ? 's' : ''}`;
    document.getElementById("cardModal").classList.add("active");
  }

  function closeModal() {
    document.getElementById("cardModal").classList.remove("active");
  }

  // [NEW JS] Updates coins, pack count, and queue generation timer every second
  function updateUI() {
    syncPackQueue();

    const btn = document.getElementById("pullBtn");
    const timerText = document.getElementById("timerText");
    const coinCountEl = document.getElementById("coinCount");
    const xpCountEl = document.getElementById("xpCount");
    const packCountEl = document.getElementById("packCount");

    coinCountEl.textContent = coins.toLocaleString();
    xpCountEl.textContent = xp.toLocaleString();
    packCountEl.textContent = queuedPacks;

    btn.disabled = queuedPacks <= 0;

    const rewardNote = timerText.dataset.lastReward ? ` (${timerText.dataset.lastReward})` : "";

    if (queuedPacks >= MAX_PACKS) {
      timerText.textContent = `Pack queue full (5/5)!${rewardNote}`;
    } else {
      const remainingMs = Math.max(0, nextPackAt - Date.now());
      const remainingSec = Math.ceil(remainingMs / 1000);
      const mins = Math.floor(remainingSec / 60);
      const secs = (remainingSec % 60).toString().padStart(2, "0");
      timerText.textContent = `Next pack generating in ${mins}:${secs}${rewardNote}`;
    }
  }

  // Initialize
  renderCollection();
  updateUI();
  setInterval(updateUI, 1000);
</script>
</body>
</html>
